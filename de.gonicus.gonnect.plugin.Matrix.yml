id: de.gonicus.gonnect.plugin.Matrix
runtime: de.gonicus.gonnect
runtime-version: 'stable'
branch: "3"

sdk: org.kde.Sdk//6.10
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

build-extension: true
separate-locales: false

build-options:
  prefix: /app/plugins/matrix
  prepend-path: /app/plugins/matrix
  env:
    RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

command: gouda_matrix

modules:
  - name: gouda-matrix
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/gouda-matrix/cargo
        CARGO_NET_OFFLINE: 'true'

    build-commands:
      # gouda_proto build.rs expects protos/ at ../protos relative to its
      # vendor directory. This symlink resolves that without a commit hash.
      - ln -sf ../../flatpak-cargo/git/gouda-core-rs-f861afb/protos cargo/vendor/protos
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --all-features
      - install -Dm0755 target/release/gouda_matrix ${FLATPAK_DEST}/bin/gouda_matrix
      - install -Dm0644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 packaging/flatpak/plugin.info ${FLATPAK_DEST}/plugin.info

    sources:
      - type: git
        url: https://github.com/gonicus/gouda-matrix.git
        tag: v0.4.0
        commit: aeaf7969de3c891a21dc27560f25d02f06f5f22d
      - type: file
        path: de.gonicus.gonnect.plugin.Matrix.metainfo.xml
      - cargo-sources.yml
